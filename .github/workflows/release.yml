name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: desktop/go.sum
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop
      - name: Smoke test macOS backend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          resources="$PWD/dist/packages/darwin-arm64/象映笔记.app/Contents/Resources"
          data_dir="$(mktemp -d)"
          cd "$resources"
          HOST=127.0.0.1 PORT=39093 NODE_ENV=production \
            XIANGYING_USERNAME=ci XIANGYING_PASSWORD=ci-smoke-password \
            DATABASE_PATH="$data_dir/notes.sqlite" CLIENT_ROOT="$resources/client" \
            ./backend/server >"$data_dir/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$data_dir"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:39093/api/health; then exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$data_dir/server.log"
          exit 1
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/packages/windows-amd64/*' -DestinationPath 'dist/xiangyin-windows-amd64.zip'
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/packages/darwin-arm64/象映笔记.app' 'dist/xiangyin-macos-arm64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/xiangyin-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
